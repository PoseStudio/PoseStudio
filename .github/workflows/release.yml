# ==============================================================================
# PoseStudio Open Source Project
# File: .github/workflows/release.yml
# Description: Builds the Windows installer + portable zip and publishes them
#              to a GitHub Release.
#
# How a release happens (see docs/RELEASING.md for the full guide):
#   1. Bump the version in CMakeLists.txt and CHANGELOG.md, merge to main.
#   2. Tag it:  git tag v0.3.9 && git push origin v0.3.9
#   3. This workflow builds everything and publishes the release automatically.
#
# It can also be run manually (Actions tab -> "Build Release" -> Run workflow)
# to test the pipeline: a manual run builds the same artifacts and uploads them
# as workflow artifacts, but does NOT publish a release.
# ==============================================================================

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 6.10.3, not 6.11.x (the dev machines' version): Qt changed the download-repo
  # layout in 6.11 (toolchain-split dirs, e.g. qt6_6111_msvc2022_64/) and no
  # aqtinstall release understands it yet — install-qt-action fails with
  # "Failed to locate XML data for Qt version". Qt 6 is source-compatible across
  # minors, so building against 6.10.3 is safe; bump this back to the dev
  # version once aqtinstall supports the new layout.
  QT_VERSION: '6.10.3'
  # The stock HDRI lighting environments (CC0, Poly Haven) are published once as
  # a "stock-content-*" release asset rather than committed to the repo (~50 MB
  # of binaries). To update the pack, upload a new stock-content-v2 release and
  # bump this tag — see docs/RELEASING.md.
  STOCK_CONTENT_TAG: 'stock-content-v1'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            # Manual pipeline-test run: not a release, use a throwaway version.
            $version = '0.0.0-dev'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # qtimageformats adds the webp/tiff image plugins so asset thumbnails
          # and HDRI previews in every common format decode at runtime.
          modules: qtimageformats
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # LunarG's "latest SDK" redirect. Two URL spellings have existed over
          # time; try both so a rename upstream doesn't break releases.
          $urls = @(
            'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe',
            'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe'
          )
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          $downloaded = $false
          foreach ($url in $urls) {
            curl.exe -fSL -o $installer $url
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
          }
          if (-not $downloaded) { throw 'Could not download the Vulkan SDK installer.' }
          # Documented silent-install invocation for the LunarG SDK installer.
          # It installs to C:\VulkanSDK\<version>, which CMakeLists.txt finds on
          # its own (it globs C:/VulkanSDK/* when VULKAN_SDK is not set).
          Start-Process -Wait -FilePath $installer -ArgumentList `
            '--accept-licenses', '--default-answer', '--confirm-command', 'install'

      - name: Configure and build (Release)
        shell: pwsh
        env:
          # HMAC key that signs the app's anonymous install ping (src/core/installping.h).
          # It lives only in this repository's Actions secrets; a fork, or a run without
          # the secret, gets an empty key and ships with the ping disabled.
          POSESTUDIO_PING_KEY: ${{ secrets.POSESTUDIO_PING_KEY }}
        run: |
          # Only a TAGGED release build carries the signing key. A workflow_dispatch pipeline
          # test produces real 0.x.y binaries that people download from the run page; with
          # the key compiled in, every such launch would count as a genuine install.
          $key = if ('${{ github.ref_type }}' -eq 'tag') { $env:POSESTUDIO_PING_KEY } else { '' }
          if ('${{ github.ref_type }}' -eq 'tag' -and -not $key) {
            Write-Warning 'POSESTUDIO_PING_KEY secret is not set: this release will never send an install ping.'
          }
          cmake -B build "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DPOSESTUDIO_PING_KEY=$key"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Stage application folder
        shell: pwsh
        run: |
          # Assemble the exact folder a user ends up with: the exe, the compiled
          # shaders and Maquettes library (mirrored next to the exe by the CMake
          # post-build steps), the Qt runtime via windeployqt, the Vulkan loader, and the
          # license texts.
          New-Item -ItemType Directory -Force dist\app | Out-Null
          Copy-Item build\Release\PoseStudio.exe dist\app\
          Copy-Item -Recurse build\Release\shaders dist\app\shaders
          Copy-Item -Recurse build\Release\Maquettes dist\app\Maquettes
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations --no-compiler-runtime dist\app\PoseStudio.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed.' }
          # The Vulkan loader (vulkan-1.dll). The exe imports it, and Windows normally
          # supplies it from the GPU driver — so a machine with no Vulkan-capable driver
          # (a VM, a fresh install still on the basic display adapter, a pre-2016 GPU)
          # has none and refuses to START the exe, before main() and before the
          # viewport's own "no Vulkan" fallback ever runs. Shipped next to the exe (the
          # app folder wins the DLL search), the Khronos loader lets such a machine start
          # normally with the viewport degraded — and still send the install ping. The
          # SDK installer above also installs this loader into System32 (its VulkanRT
          # helper), version-matched to the SDK the app was built against, so it is
          # copied from there; if a future SDK stops doing that, ship it from LunarG's
          # vulkan-runtime-components.zip instead (docs/RELEASING.md). Its license
          # travels with it under licenses\.
          $loader = Join-Path $env:SystemRoot 'System32\vulkan-1.dll'
          if (-not (Test-Path $loader)) {
            throw 'vulkan-1.dll is not in System32: the Vulkan SDK installer did not install the runtime (see docs/RELEASING.md).'
          }
          $loaderInfo = (Get-Item $loader).VersionInfo
          if ($loaderInfo.FileDescription -ne 'Vulkan Loader') {
            throw "System32\vulkan-1.dll is not the Khronos loader (FileDescription: '$($loaderInfo.FileDescription)')."
          }
          Copy-Item $loader dist\app\
          Write-Host "Bundled Vulkan loader $($loaderInfo.FileVersion)"
          # The Visual C++ runtime, app-local. windeployqt's --compiler-runtime was a no-op
          # here (it wants VCINSTALLDIR, which only a VS developer shell sets) and would
          # only ever have dropped vc_redist.x64.exe into the folder - an installer that
          # needs administrator rights, which the per-user setup deliberately never has,
          # and which a portable user would have to find and run. So the runtime is
          # deployed the way Microsoft documents for exactly this case: the DLLs from
          # VC\Redist\MSVC\<ver>\x64\Microsoft.VC14x.CRT copied next to the exe, where they
          # beat System32 in the DLL search. Only the ones the package's binaries actually
          # import are copied - found by dumpbin over everything staged so far, so a Qt or
          # toolset bump that adds a dependency picks it up on its own. The redist comes
          # from the same Visual Studio that just compiled the app, so it can never be
          # older than what the exe was linked against. The UCRT (api-ms-win-crt-*,
          # ucrtbase) is part of Windows 10 and 11 and is not shipped. Without this, a
          # machine lacking the runtime failed at launch with "VCRUNTIME140.dll not found".
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'vswhere found no Visual Studio with the C++ toolset.' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $crtDir = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $dumpbin -or -not $crtDir) { throw "dumpbin.exe or the VC redist CRT folder is missing under $vs." }
          $crtNeeded = Get-ChildItem dist\app -Recurse -Include *.exe, *.dll | ForEach-Object {
            & $dumpbin.FullName /nologo /dependents $_.FullName | ForEach-Object {
              if ($_ -match '^\s+((?:msvcp|vcruntime|concrt|vccorlib)\d+\w*\.dll)\s*$') { $Matches[1].ToLower() }
            }
          } | Sort-Object -Unique
          if (-not $crtNeeded) { throw 'No Visual C++ runtime imports found in the staged binaries - the dumpbin scan is broken.' }
          foreach ($dll in $crtNeeded) {
            $src = Join-Path $crtDir.FullName $dll
            if (-not (Test-Path $src)) { throw "$dll is imported by the package but is not in $($crtDir.FullName)." }
            Copy-Item $src dist\app\
          }
          Write-Host "Bundled Visual C++ runtime $($crtDir.Parent.Parent.Name): $($crtNeeded -join ', ')"
          # License texts. PoseStudio is GPL v3, and Qt is used under the LGPL v3, which asks
          # that every copy carry a prominent notice of that use, the LGPL and GPL texts, and
          # a way to relink against a modified Qt (the Qt DLLs are separate, replaceable files
          # - that is the mechanism). LICENSE.txt is the GPL v3 both licenses need; licenses\
          # holds the LGPL, the notices of the runtimes windeployqt ships beside Qt (ICU,
          # Mesa's software OpenGL, Microsoft's D3D compiler), the Vulkan loader's, those of
          # the open-source libraries compiled into the exe (GLM, VMA, OpenXR, ufbx, cgltf,
          # LightUSD and the rest - NOTICES.txt lists them), and NOTICES.txt, the index, rendered with the Qt version so it names exactly what
          # was shipped and where its source lives.
          Copy-Item LICENSE dist\app\LICENSE.txt
          # The GPL section 7 additional permission (the render engine's NVIDIA devices) is part
          # of PoseStudio's license terms, so it travels with the GPL text.
          Copy-Item LICENSE-EXCEPTION.txt dist\app\LICENSE-EXCEPTION.txt
          New-Item -ItemType Directory -Force dist\app\licenses | Out-Null
          Copy-Item packaging\licenses\*.txt dist\app\licenses\
          $qtMajorMinor = $env:QT_VERSION -replace '\.\d+$', ''
          (Get-Content packaging\licenses\NOTICES.txt -Raw).Replace('{{QT_VERSION}}', $env:QT_VERSION).Replace('{{QT_MAJOR_MINOR}}', $qtMajorMinor) |
            Out-File dist\app\licenses\NOTICES.txt -Encoding utf8

      - name: Download stock HDRI content pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist\stock | Out-Null
          gh release download $env:STOCK_CONTENT_TAG `
            --repo ${{ github.repository }} `
            --pattern 'PoseStudio-Stock-HDRIs*.zip' --dir dist\stock
          if ($LASTEXITCODE -ne 0) { throw "Could not download the $env:STOCK_CONTENT_TAG release asset." }
          $zip = Get-ChildItem dist\stock\PoseStudio-Stock-HDRIs*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dist\hdri

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force dist\out | Out-Null
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DAppDir=$PWD\dist\app" `
            "/DHdriDir=$PWD\dist\hdri" `
            "/DOutDir=$PWD\dist\out" `
            packaging\PoseStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Build portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable\PoseStudio | Out-Null
          Copy-Item -Recurse dist\app\* dist\portable\PoseStudio\
          # Portable users copy this folder into Documents themselves —
          # README.txt (from packaging/portable-readme.txt) explains how.
          New-Item -ItemType Directory -Force "dist\portable\PoseStudio\stock-content" | Out-Null
          Copy-Item -Recurse dist\hdri "dist\portable\PoseStudio\stock-content\hdri"
          Copy-Item packaging\portable-readme.txt dist\portable\PoseStudio\README.txt
          Compress-Archive -Path dist\portable\PoseStudio `
            -DestinationPath "dist\out\PoseStudio-${{ steps.version.outputs.version }}-Windows-Portable.zip"

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # ASCII (not the PS5 UTF-16 default) so shasum/CertUtil can read it.
          $lines | Out-File dist\out\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\out\SHA256SUMS.txt

      - name: Prepare release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $body = Get-Content packaging\release-notes-template.md -Raw
          $body = $body.Replace('{{VERSION}}', '${{ steps.version.outputs.version }}')
          $body | Out-File dist\release-body.md -Encoding utf8

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: PoseStudio ${{ steps.version.outputs.version }}
          body_path: dist/release-body.md
          files: dist/out/*
          # Appends an auto-generated "What's Changed" commit/PR list below the
          # install instructions from the template.
          generate_release_notes: true

      - name: Upload build artifacts (manual test runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: PoseStudio-windows-${{ steps.version.outputs.version }}
          path: dist/out/*
